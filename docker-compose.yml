# One-command start:   docker compose up -d --build
# Then open http://localhost:4500 and sign in with PR_REVIEW_UI_PASSWORD.
#
# Put GITHUB_TOKEN, GITHUB_OWNER, GITHUB_REPO and PR_REVIEW_UI_PASSWORD in .env next to this file.
services:
  pr-review-ui:
    build: .
    ports:
      # Bound to this machine only. To share it with others, change this to "4500:4500", add the
      # address people will use to PR_REVIEW_UI_ALLOWED_HOSTS below, and serve it over HTTPS (for
      # example behind a reverse proxy) with PR_REVIEW_UI_COOKIE_SECURE=true.
      - "127.0.0.1:4500:4500"
    env_file: .env
    environment:
      PR_REVIEW_UI_PASSWORD: ${PR_REVIEW_UI_PASSWORD:?Set PR_REVIEW_UI_PASSWORD in .env - the UI can post to GitHub, so it must have a password}
      PR_REVIEW_UI_ALLOWED_HOSTS: "localhost:4500,127.0.0.1:4500"
      # Inside the container "localhost" is the container itself, so reach Ollama on the host
      # machine instead. (Override these two lines if Ollama runs on another server.)
      ANTHROPIC_BASE_URL: http://host.docker.internal:11434
    extra_hosts:
      - "host.docker.internal:host-gateway"   # needed on Linux; Docker Desktop provides it already
    volumes:
      - pr-review-data:/data
      # Rule documents, editable from the UI's "Review rules" section and kept on your disk.
      - ./docs/conventions:/app/docs/conventions
    restart: unless-stopped

volumes:
  pr-review-data:
