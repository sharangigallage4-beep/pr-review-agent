name: CI

on:
  push:
  pull_request:

# Least privilege: this workflow only checks out code and runs local tests - it never calls the
# GitHub API. Without this block, the job would run with the repo/org's DEFAULT GITHUB_TOKEN
# permissions, which on many repos is broad read-write - unnecessary exposure, especially since
# `npm ci`/`npm test` here execute the PR's own code (including from forks), with the ambient
# GITHUB_TOKEN available to every step regardless of whether the workflow references it.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # 20.x and 22.x cover the current and previous Node LTS lines. The package's
        # engines.node floor (>=18.0.0) isn't included here because this project's test suite
        # relies on node:test being run via `node --import tsx`, which needs a newer --import
        # loader implementation than early Node 18 shipped with.
        node-version: [20.x, 22.x]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: package-lock.json

      - run: npm ci

      - run: npm run typecheck

      - run: npm test
