<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PR Review Assistant</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%233b5bdb'/%3E%3Cpath d='M10 9v14M22 9v8M22 17a3 3 0 1 1-6 0' stroke='white' stroke-width='2.4' fill='none' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
  :root {
    --bg: #f3f5fa; --surface: #ffffff; --surface-2: #f7f8fc; --text: #172033; --muted: #5d6b82; --border: #e2e7f0;
    --accent: #3b5bdb; --accent-hover: #2f4bc4; --accent-soft: #edf1ff; --accent-text: #ffffff;
    --ok: #168a52; --warn: #b36b00; --bad: #c8372d; --idle: #8a96aa;
    --crit: #c8372d; --high: #dd6b2c; --med: #b8860b; --low: #4f7cac;
    --banner: linear-gradient(135deg, #3b5bdb 0%, #6741d9 100%);
    --shadow: 0 1px 2px rgba(23, 32, 51, .05), 0 6px 20px rgba(23, 32, 51, .06);
    --shadow-lift: 0 2px 4px rgba(23, 32, 51, .06), 0 10px 28px rgba(23, 32, 51, .10);
    --radius: 14px; --on-sev: #ffffff;
  }
  /* Theme: follows the system unless the user picks one (data-theme on <html>). */
  :root[data-theme="dark"] {
      --bg: #0e1320; --surface: #161d2e; --surface-2: #1b2438; --text: #e8ecf5; --muted: #93a1ba; --border: #263148;
      --accent: #7c93ff; --accent-hover: #93a6ff; --accent-soft: #1d2745; --accent-text: #0b1020;
      --ok: #4cc38a; --warn: #e5ac52; --bad: #ff8076; --idle: #7a879c;
      --crit: #ff8076; --high: #ff9d62; --med: #e5bd52; --low: #82b3e6;
      --banner: linear-gradient(135deg, #1d2b66 0%, #3b2a7a 100%);
      --shadow: none; --shadow-lift: 0 8px 28px rgba(0, 0, 0, .35); --on-sev: #1a1016;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0e1320; --surface: #161d2e; --surface-2: #1b2438; --text: #e8ecf5; --muted: #93a1ba; --border: #263148;
      --accent: #7c93ff; --accent-hover: #93a6ff; --accent-soft: #1d2745; --accent-text: #0b1020;
      --ok: #4cc38a; --warn: #e5ac52; --bad: #ff8076; --idle: #7a879c;
      --crit: #ff8076; --high: #ff9d62; --med: #e5bd52; --low: #82b3e6;
      --banner: linear-gradient(135deg, #1d2b66 0%, #3b2a7a 100%);
      --shadow: none; --shadow-lift: 0 8px 28px rgba(0, 0, 0, .35); --on-sev: #1a1016;
    }
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  .wrap { max-width: 960px; margin: 0 auto; padding: 0 16px; }

  /* ---- banner */
  .banner { background: var(--banner); color: #fff; padding: 28px 0 64px; }
  .banner .wrap { display: flex; flex-wrap: wrap; gap: 16px; align-items: center; justify-content: space-between; }
  .brand { display: flex; align-items: center; gap: 14px; }
  .logo { width: 44px; height: 44px; border-radius: 12px; background: rgba(255,255,255,.16); display: grid; place-items: center; flex: none; }
  h1 { font-size: 22px; line-height: 1.2; margin: 0; letter-spacing: -.01em; }
  .tagline { margin: 2px 0 0; font-size: 13.5px; opacity: .85; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip { display: inline-flex; align-items: center; gap: 7px; padding: 5px 12px; border-radius: 999px; background: rgba(255,255,255,.14); border: 1px solid rgba(255,255,255,.22); font-size: 13px; color: #fff; }
  select.chip { appearance: auto; font-family: inherit; }
  select.chip option { color: #111; background: #fff; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: #b8c0d4; flex: none; }
  .dot.ok { background: #5be3a0; box-shadow: 0 0 0 3px rgba(91,227,160,.25); }
  .dot.bad { background: #ff8f84; box-shadow: 0 0 0 3px rgba(255,143,132,.25); }
  .dot.warn { background: #ffc766; box-shadow: 0 0 0 3px rgba(255,199,102,.25); }

  main { margin-top: -40px; padding-bottom: 72px; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); }
  .pad { padding: 16px 18px; }
  .bar { display: flex; flex-wrap: wrap; gap: 12px; align-items: end; }
  .field { flex: 1 1 170px; min-width: 0; }
  label.lbl { display: block; font-size: 12px; font-weight: 600; letter-spacing: .02em; color: var(--muted); margin-bottom: 4px; }
  input[type=text] { width: 100%; padding: 9px 12px; border: 1px solid var(--border); border-radius: 10px; background: var(--surface-2); color: var(--text); font: inherit; transition: border-color .15s, box-shadow .15s; }
  input[type=text]:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .check { display: flex; align-items: center; gap: 8px; margin-top: 14px; font-size: 14px; color: var(--muted); cursor: pointer; }
  .check input { accent-color: var(--accent); width: 16px; height: 16px; }

  button { font: inherit; font-weight: 500; cursor: pointer; border-radius: 10px; border: 1px solid var(--border); background: var(--surface); color: var(--text); padding: 8px 16px; transition: background .15s, border-color .15s, box-shadow .15s, transform .05s; }
  button:hover:not(:disabled) { background: var(--surface-2); border-color: var(--idle); }
  button:active:not(:disabled) { transform: translateY(1px); }
  button.primary { background: var(--accent); color: var(--accent-text); border-color: var(--accent); font-weight: 600; box-shadow: 0 1px 2px rgba(59,91,219,.35); }
  button.primary:hover:not(:disabled) { background: var(--accent-hover); border-color: var(--accent-hover); }
  button.ghost { background: transparent; }
  button:disabled { opacity: .55; cursor: not-allowed; }
  button:focus-visible, a:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .section-head { display: flex; align-items: baseline; justify-content: space-between; margin: 32px 2px 12px; }
  h2 { font-size: 17px; margin: 0; letter-spacing: -.005em; }
  .count { font-size: 13px; color: var(--muted); }
  .list { display: grid; gap: 12px; }

  /* ---- PR cards */
  .pr { display: flex; flex-wrap: wrap; gap: 14px; align-items: center; padding: 14px 16px 14px 14px; border-left: 4px solid var(--border); transition: box-shadow .15s, transform .15s; }
  .pr:hover { box-shadow: var(--shadow-lift); transform: translateY(-1px); }
  .pr.s-posted, .pr.s-done { border-left-color: var(--ok); } .pr.s-failed { border-left-color: var(--bad); }
  .pr.s-running, .pr.s-queued, .pr.s-awaiting_confirmation { border-left-color: var(--warn); }
  .avatar { width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; color: #fff; font-weight: 700; font-size: 15px; flex: none; text-transform: uppercase; }
  .pr-main { flex: 1 1 220px; min-width: 0; }
  .pr-title { font-weight: 600; overflow-wrap: anywhere; }
  .pr-title a { color: inherit; text-decoration: none; }
  .pr-title a:hover { color: var(--accent); }
  .num { display: inline-block; font-variant-numeric: tabular-nums; color: var(--muted); font-weight: 600; margin-right: 6px; }
  .meta { font-size: 13px; color: var(--muted); overflow-wrap: anywhere; margin-top: 2px; }
  .branch { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; background: var(--surface-2); border: 1px solid var(--border); border-radius: 6px; padding: 0 6px; }
  .row-actions { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
  .badge { display: inline-flex; align-items: center; gap: 6px; padding: 2px 10px; border-radius: 999px; font-size: 12px; font-weight: 600; background: var(--surface-2); border: 1px solid var(--border); color: var(--muted); white-space: nowrap; }
  .badge::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
  .badge.posted, .badge.done { color: var(--ok); } .badge.failed { color: var(--bad); }
  .badge.running, .badge.queued, .badge.awaiting_confirmation { color: var(--warn); }
  .badge.running::before { animation: pulse 1.2s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .25; } }

  .empty { text-align: center; padding: 34px 16px; color: var(--muted); }
  .empty svg { display: block; margin: 0 auto 10px; opacity: .55; }
  .error { color: var(--bad); }

  /* ---- review panel */
  .panel { margin-top: 20px; border-top: 4px solid var(--accent); animation: rise .2s ease-out; }
  @keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  .panel-head { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; }
  .panel-title { font-size: 16px; font-weight: 700; }
  .steps { list-style: none; padding: 0; margin: 14px 0 4px; display: grid; gap: 8px; }
  .steps li { display: flex; gap: 10px; align-items: center; color: var(--muted); }
  .steps li.done { color: var(--text); } .steps li.active { color: var(--text); font-weight: 600; }
  .step-ico { width: 20px; height: 20px; border-radius: 50%; display: grid; place-items: center; font-size: 12px; border: 2px solid var(--border); flex: none; }
  .done .step-ico { background: var(--ok); border-color: var(--ok); color: #fff; }
  .spinner { width: 20px; height: 20px; border: 2px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin .9s linear infinite; flex: none; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .summary { margin: 14px 0 6px; padding: 12px 14px; background: var(--surface-2); border-radius: 10px; overflow-wrap: anywhere; }
  .pills { display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 0 4px; }
  .pill { font-size: 13px; font-weight: 600; padding: 3px 12px; border-radius: 999px; color: var(--on-sev); }
  .pill.critical, .sev.critical { background: var(--crit); } .pill.high, .sev.high { background: var(--high); }
  .pill.medium, .sev.medium { background: var(--med); } .pill.low, .sev.low { background: var(--low); }
  .pill.none { background: var(--ok); color: #fff; }
  .finding { margin-top: 12px; padding: 12px 14px; border: 1px solid var(--border); border-left: 4px solid var(--idle); border-radius: 10px; }
  .finding.critical { border-left-color: var(--crit); } .finding.high { border-left-color: var(--high); }
  .finding.medium { border-left-color: var(--med); } .finding.low { border-left-color: var(--low); }
  .sev { display: inline-block; color: var(--on-sev); font-size: 11px; font-weight: 700; letter-spacing: .04em; padding: 2px 8px; border-radius: 6px; }
  .loc { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12.5px; color: var(--muted); margin-left: 8px; overflow-wrap: anywhere; }
  .finding h4 { margin: 8px 0 4px; font-size: 15px; overflow-wrap: anywhere; }
  .finding p { margin: 4px 0; overflow-wrap: anywhere; white-space: pre-wrap; }
  .fix { margin-top: 8px; background: var(--accent-soft); border-radius: 8px; padding: 8px 12px; font-size: 14px; overflow-wrap: anywhere; }
  .actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 16px; align-items: center; }
  .hint { color: var(--muted); font-size: 13.5px; }
  details { margin-top: 14px; font-size: 13px; color: var(--muted); }
  summary { cursor: pointer; }
  pre { white-space: pre-wrap; overflow-wrap: anywhere; margin: 8px 0 0; padding: 10px 12px; background: var(--surface-2); border-radius: 8px; font-size: 12px; }
  a.link { color: var(--accent); font-weight: 600; }

  .thumbs { display: inline-flex; gap: 6px; margin-left: auto; }
  .thumb { padding: 2px 10px; font-size: 14px; line-height: 1.4; }
  .thumb.on-up { background: var(--ok); border-color: var(--ok); color: #fff; }
  .thumb.on-down { background: var(--bad); border-color: var(--bad); color: #fff; }
  .finding-top { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .accuracy { font-size: 13px; color: var(--muted); }
  .switch-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-top: 10px; font-size: 14px; color: var(--muted); }
  .switch-row input { accent-color: var(--accent); width: 16px; height: 16px; }
  .tag { font-size: 11.5px; font-weight: 600; padding: 1px 8px; border-radius: 6px; background: var(--accent-soft); color: var(--accent); }
  textarea { width: 100%; min-height: 280px; padding: 10px 12px; border: 1px solid var(--border); border-radius: 10px; background: var(--surface-2); color: var(--text); font: 13px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; resize: vertical; }
  textarea:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  #login { max-width: 420px; margin: 40px auto 0; }
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; margin-top: 16px; }
  .stat { padding: 12px 16px; }
  .stat .big { font-size: 26px; font-weight: 700; line-height: 1.15; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
  .stat .label { font-size: 12.5px; color: var(--muted); }
  .stat.wide { grid-column: 1 / -1; }
  .stat .tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
  .toolbar { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 12px; }
  .toolbar input[type=text] { flex: 1 1 220px; }
  select { padding: 9px 12px; border: 1px solid var(--border); border-radius: 10px; background: var(--surface-2); color: var(--text); font: inherit; }
  .toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: var(--text); color: var(--bg); padding: 10px 18px; border-radius: 10px; box-shadow: var(--shadow-lift); font-size: 14px; max-width: calc(100vw - 32px); z-index: 10; }
  @media (max-width: 560px) { .banner { padding-bottom: 56px; } .row-actions { width: 100%; } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<div class="banner">
  <div class="wrap">
    <div class="brand">
      <div class="logo" aria-hidden="true">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="6" r="2.2"/><circle cx="6" cy="18" r="2.2"/><circle cx="18" cy="16" r="2.2"/><path d="M6 8.2v7.6M18 13.8V9a3 3 0 0 0-3-3h-3"/><path d="m13.5 3.5-1.6 2.5 1.6 2.5"/></svg>
      </div>
      <div>
        <h1>PR Review Assistant</h1>
        <p class="tagline">AI code review for your pull requests, in one click</p>
      </div>
    </div>
    <div class="chips" id="chips" aria-live="polite"></div>
  </div>
</div>

<main class="wrap">
  <section class="card pad" id="login" hidden aria-label="Sign in">
    <h2 style="margin-top:0">Sign in</h2>
    <p class="hint">This review assistant is password protected.</p>
    <label class="lbl" for="password">PASSWORD</label>
    <input type="password" id="password" autocomplete="current-password" style="width:100%;padding:9px 12px;border:1px solid var(--border);border-radius:10px;background:var(--surface-2);color:var(--text);font:inherit">
    <div class="actions"><button class="primary" id="signin">Sign in</button></div>
  </section>

  <div id="app">
  <section class="card pad" aria-label="Repository">
    <div class="bar">
      <div class="field"><label class="lbl" for="owner">OWNER</label><input type="text" id="owner" autocomplete="off" spellcheck="false" placeholder="e.g. my-company"></div>
      <div class="field"><label class="lbl" for="repo">REPOSITORY</label><input type="text" id="repo" autocomplete="off" spellcheck="false" placeholder="e.g. my-project"></div>
      <button class="primary" id="load">Load pull requests</button>
    </div>
    <label class="check"><input type="checkbox" id="autopost"> Post comments to GitHub automatically (skip the preview)</label>
    <div class="switch-row"><label class="check" style="margin:0"><input type="checkbox" id="autoreview"> Auto-review new pull requests and new commits</label><span id="autostatus"></span></div>
  </section>

  <section class="stats" id="stats" hidden aria-label="Overview"></section>

  <div class="section-head"><h2>Open pull requests</h2><span class="count" id="prcount"></span></div>
  <div class="toolbar">
    <input type="text" id="filter" placeholder="Filter by title, branch, author or #number" aria-label="Filter pull requests" autocomplete="off">
    <select id="statusfilter" aria-label="Show">
      <option value="all">All</option>
      <option value="new">Not reviewed yet</option>
      <option value="decision">Needs my decision</option>
      <option value="failed">Failed</option>
    </select>
    <button id="bulk" hidden></button>
  </div>
  <div class="list" id="prs"></div>

  <section class="card pad panel" id="panel" hidden aria-live="polite"></section>

  <div class="section-head"><h2>Recent reviews</h2><span class="accuracy" id="accuracy"></span></div>
  <div class="list" id="jobs"></div>

  <div class="section-head"><h2>Review rules</h2><button class="ghost" id="newdoc">New document</button></div>
  <div class="list" id="rules"></div>
  <section class="card pad panel" id="editor" hidden></section>
  </div>
</main>
<div class="toast" id="toast" role="status" hidden></div>

<script>
(function () {
  'use strict';

  // ---- tiny DOM helper. Everything dynamic goes through textContent, never innerHTML, because PR
  // titles, branch names and review findings are untrusted text.
  function el(tag, props) {
    var node = document.createElement(tag);
    props = props || {};
    Object.keys(props).forEach(function (key) {
      if (props[key] == null) return;
      if (key === 'text') node.textContent = props[key];
      else if (key === 'class') node.className = props[key];
      else if (key === 'on') Object.keys(props.on).forEach(function (ev) { node.addEventListener(ev, props.on[ev]); });
      else node.setAttribute(key, props[key]);
    });
    for (var i = 2; i < arguments.length; i++) {
      var child = arguments[i];
      if (child == null || child === false) continue;
      node.appendChild(typeof child === 'string' ? document.createTextNode(child) : child);
    }
    return node;
  }
  var $ = function (id) { return document.getElementById(id); };

  function api(path, options) {
    options = options || {};
    var method = options.method || 'GET';
    var init = { method: method, headers: {} };
    // Every write carries a JSON content type: the server only accepts those, which a page on
    // another website cannot send.
    if (method !== 'GET') init.headers['Content-Type'] = 'application/json';
    if (options.body !== undefined) init.body = JSON.stringify(options.body);
    return fetch(path, init).then(function (res) {
      return res.json().catch(function () { return {}; }).then(function (data) {
        if (res.status === 401 && path !== '/api/login') { showLogin(); throw new Error(data.error || 'Please sign in.'); }
        if (!res.ok) throw new Error(data.error || ('Request failed (' + res.status + ')'));
        return data;
      });
    });
  }

  function ago(iso) {
    var s = Math.max(0, Math.round((Date.now() - new Date(iso).getTime()) / 1000));
    if (s < 60) return 'just now';
    if (s < 3600) return Math.round(s / 60) + ' min ago';
    if (s < 86400) return Math.round(s / 3600) + ' h ago';
    return Math.round(s / 86400) + ' d ago';
  }

  var toastTimer = null;
  function toast(message) {
    var t = $('toast');
    t.textContent = message; t.hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { t.hidden = true; }, 5000);
  }

  var store = {
    get: function (k) { try { return localStorage.getItem(k) || ''; } catch (e) { return ''; } },
    set: function (k, v) { try { localStorage.setItem(k, v); } catch (e) { /* storage unavailable */ } }
  };

  // ---- theme: auto (follow the system) -> light -> dark
  var THEMES = ['auto', 'light', 'dark'];
  var theme = THEMES.indexOf(store.get('theme')) >= 0 ? store.get('theme') : 'auto';
  function applyTheme() {
    if (theme === 'auto') document.documentElement.removeAttribute('data-theme');
    else document.documentElement.setAttribute('data-theme', theme);
  }
  function cycleTheme() {
    theme = THEMES[(THEMES.indexOf(theme) + 1) % THEMES.length];
    store.set('theme', theme); applyTheme(); refreshStatus();
  }
  applyTheme();

  function avatar(name) {
    var label = name || '?', hash = 0;
    for (var i = 0; i < label.length; i++) hash = (hash * 31 + label.charCodeAt(i)) % 360;
    return el('div', { class: 'avatar', 'aria-hidden': 'true', text: label.charAt(0), style: 'background:hsl(' + hash + ',48%,46%)' });
  }
  function emptyState(message) {
    return el('div', { class: 'card empty' },
      message);
  }

  var state = { prs: [], jobs: [], openJobId: null, loaded: null };
  var STATUS_TEXT = { queued: 'Waiting in line', running: 'Reviewing…', awaiting_confirmation: 'Needs your decision', posted: 'Posted', done: 'Finished', cancelled: 'Discarded', skipped: 'Nothing to review', failed: 'Failed' };
  var ACTIVE = { queued: 1, running: 1, awaiting_confirmation: 1 };
  var SEVERITIES = ['critical', 'high', 'medium', 'low'];

  // ---- header status chips
  function renderStatus(s) {
    var chips = $('chips');
    chips.textContent = '';
    var m = s.model, label, cls;
    if (m.kind === 'ollama') {
      if (!m.reachable) { label = 'AI model: Ollama not reachable'; cls = 'bad'; }
      else if (m.modelInstalled === false) { label = 'AI model: “' + m.name + '” is not installed in Ollama'; cls = 'warn'; }
      else { label = 'AI model: Ollama · ' + (m.name || 'default'); cls = 'ok'; }
    } else { label = 'AI model: Anthropic API' + (m.name ? ' · ' + m.name : ''); cls = 'ok'; }
    chips.appendChild(el('span', { class: 'chip', title: m.baseUrl || '' }, el('span', { class: 'dot ' + cls }), label));
    if (state.providers && state.providers.available) chips.insertBefore(providerPicker(), chips.firstChild);
    var usageChip = usageChipNode();
    if (usageChip) chips.appendChild(usageChip);
    chips.appendChild(el('span', { class: 'chip' }, el('span', { class: 'dot ' + (s.github.configured ? 'ok' : 'bad') }),
      s.github.configured ? 'GitHub connected' : 'GitHub token missing'));
    chips.appendChild(el('button', { class: 'chip', style: 'cursor:pointer', title: 'Switch between automatic, light and dark', text: 'Theme: ' + theme, on: { click: cycleTheme } }));
    if (state.authRequired) chips.appendChild(el('button', { class: 'chip', style: 'cursor:pointer', text: 'Sign out', on: { click: signOut } }));
  }
  // ---- Claude usage: tokens (and an estimated price when prices are set in .env) this month
  function fmtTokens(n) { return n >= 1e6 ? (n / 1e6).toFixed(2) + 'M' : n >= 1e3 ? (n / 1e3).toFixed(1) + 'k' : String(n); }
  function fmtUsd(n) { return '$' + (n < 0.1 ? n.toFixed(3) : n.toFixed(2)); }
  function usageChipNode() {
    var u = state.usage;
    if (!u || !u.available || (!u.reviews && u.percentUsed === undefined)) return null;
    var text = 'Claude ' + u.month + ': ' + fmtTokens(u.totalTokens) + ' tokens' + (u.costUsd !== undefined ? ' ≈ ' + fmtUsd(u.costUsd) : '');
    if (u.percentUsed !== undefined) text += ' · ' + u.percentUsed + '% of limit';
    var lines = [u.reviews + ' review(s) this month: ' + u.inputTokens.toLocaleString() + ' tokens in, ' + u.outputTokens.toLocaleString() + ' tokens out.'];
    if (!u.priced) lines.push('No prices set, so no cost is shown (CLAUDE_PRICE_INPUT_PER_MTOK / CLAUDE_PRICE_OUTPUT_PER_MTOK in .env).');
    else lines.push('The cost is an estimate from the prices set in .env.');
    if (u.limits.tokens) lines.push('Token limit per month: ' + u.limits.tokens.toLocaleString());
    if (u.limits.usd) lines.push('Budget per month: ' + fmtUsd(u.limits.usd));
    if (u.exceeded) lines.push('The limit is reached: new Claude reviews are refused until next month.');
    return el('span', { class: 'chip', title: lines.join('\n') },
      el('span', { class: 'dot ' + (u.exceeded ? 'bad' : (u.percentUsed >= 80 ? 'warn' : 'ok')) }), text);
  }

  // The AI chooser: Ollama (this computer) or Claude (API). Unavailable ones are greyed out with the reason.
  function providerPicker() {
    var sel = el('select', { class: 'chip', style: 'cursor:pointer', title: 'Which AI writes the reviews', 'aria-label': 'AI provider' });
    state.providers.providers.forEach(function (p) {
      var o = el('option', { text: p.label + ' · ' + p.model + (p.available ? '' : ' (not set up)') });
      o.value = p.id;
      o.disabled = !p.available;
      if (!p.available && p.reason) o.title = p.reason;
      if (p.id === state.providers.selected) o.selected = true;
      sel.appendChild(o);
    });
    sel.addEventListener('change', function () {
      api('/api/provider', { method: 'POST', body: { id: sel.value } })
        .then(function (r) { state.providers.selected = r.selected; return refreshStatus(); })
        .catch(function (err) { window.alert(err.message || 'Could not switch the AI.'); return refreshStatus(); });
    });
    return sel;
  }
  function refreshStatus() {
    return api('/api/provider').catch(function () { return null; }).then(function (p) {
      state.providers = p;
      return api('/api/usage').catch(function () { return null; });
    }).then(function (u) {
      state.usage = u;
      return api('/api/status');
    }).then(renderStatus).catch(function () {
      renderStatus({ model: { kind: 'ollama', reachable: false }, github: { configured: false } });
    });
  }

  // ---- pull request list
  function latestJobFor(prNumber) {
    for (var i = 0; i < state.jobs.length; i++) {
      var j = state.jobs[i];
      if (j.pr === prNumber && state.loaded && j.owner === state.loaded.owner && j.repo === state.loaded.repo) return j;
    }
    return null;
  }
  function visiblePrs() {
    var text = $('filter').value.trim().toLowerCase().replace(/^#/, '');
    var mode = $('statusfilter').value;
    return state.prs.filter(function (pr) {
      var job = latestJobFor(pr.number);
      if (mode === 'new' && job) return false;
      if (mode === 'decision' && !(job && job.status === 'awaiting_confirmation')) return false;
      if (mode === 'failed' && !(job && job.status === 'failed')) return false;
      if (!text) return true;
      return [String(pr.number), pr.title, pr.branch, pr.author || ''].join(' ').toLowerCase().indexOf(text) >= 0;
    });
  }
  function unreviewedPrs() {
    return state.prs.filter(function (pr) { return !pr.draft && !latestJobFor(pr.number); });
  }
  function updateBulk() {
    var n = state.loaded ? unreviewedPrs().length : 0;
    var btn = $('bulk');
    btn.hidden = n < 2;
    btn.textContent = 'Review all ' + n + ' not yet reviewed';
  }
  function reviewAllNew() {
    var todo = unreviewedPrs();
    if (!todo.length || !window.confirm('Start ' + todo.length + ' reviews? They run one after another, and each can take a few minutes on a local model.')) return;
    var post = $('autopost').checked;
    todo.reduce(function (chain, pr) {
      return chain.then(function () { return api('/api/jobs', { method: 'POST', body: { owner: state.loaded.owner, repo: state.loaded.repo, pr: pr.number, autoPost: post } }); });
    }, Promise.resolve()).then(function () { toast(todo.length + ' reviews queued.'); return pollJobs(); }).catch(function (err) { toast(err.message); pollJobs(); });
  }

  function fmtDuration(ms) {
    var s = Math.max(0, Math.round(ms / 1000));
    return s < 60 ? s + ' s' : Math.floor(s / 60) + ' min ' + (s % 60) + ' s';
  }

  function ruleIds(title) {
    var m = /^((?:[A-Z]{1,3}\d+)(?:\/[A-Z]{1,3}\d+)*)\b/.exec(title || '');
    return m ? m[1].split('/') : [];
  }
  function renderStats() {
    var box = $('stats');
    var reviewed = state.jobs.filter(function (j) { return j.preview; });
    if (reviewed.length === 0) { box.hidden = true; return; }
    box.hidden = false; box.textContent = '';
    var findings = 0, posted = 0, rules = {};
    reviewed.forEach(function (j) {
      var all = j.preview.inlineFindings.concat(j.preview.summaryOnlyFindings);
      findings += all.length;
      if (j.status === 'posted') posted++;
      all.forEach(function (f) { ruleIds(f.title).forEach(function (r) { rules[r] = (rules[r] || 0) + 1; }); });
    });
    function tile(big, label) { return el('div', { class: 'card stat' }, el('div', { class: 'big', text: String(big) }), el('div', { class: 'label', text: label })); }
    box.appendChild(tile(reviewed.length, 'reviews run'));
    box.appendChild(tile(findings, 'findings'));
    box.appendChild(tile(posted, 'posted to GitHub'));
    var top = Object.keys(rules).sort(function (a, b) { return rules[b] - rules[a]; }).slice(0, 6);
    if (top.length) {
      var tags = el('div', { class: 'tags' });
      top.forEach(function (r) { tags.appendChild(el('span', { class: 'tag', text: r + ' × ' + rules[r] })); });
      box.appendChild(el('div', { class: 'card stat wide' }, el('div', { class: 'label', text: 'Most often broken rules' }), tags));
    }
  }

  function toMarkdown(job) {
    var p = job.preview, all = p.inlineFindings.concat(p.summaryOnlyFindings);
    var lines = ['# Review of ' + (job.kind === 'local' ? job.label : job.owner + '/' + job.repo + '#' + job.pr), '', p.summary, '', '## Findings (' + all.length + ')', ''];
    all.forEach(function (f) {
      lines.push('### [' + f.severity.toUpperCase() + '] ' + f.title, '`' + f.file + ':' + f.line + '`', '', f.explanation, '', '**Suggested fix:** ' + f.suggestedFix, '');
    });
    return lines.join('\n');
  }
  function copyText(text) {
    var done = function () { toast('Copied to the clipboard.'); };
    if (navigator.clipboard && navigator.clipboard.writeText) { navigator.clipboard.writeText(text).then(done, function () { toast('Could not copy.'); }); return; }
    var area = document.createElement('textarea');
    area.value = text; document.body.appendChild(area); area.select();
    try { document.execCommand('copy'); done(); } catch (e) { toast('Could not copy.'); }
    document.body.removeChild(area);
  }

  function renderPrs() {
    var box = $('prs');
    box.textContent = '';
    updateBulk();
    var shown = state.loaded ? visiblePrs() : [];
    $('prcount').textContent = state.loaded && state.prs.length ? (shown.length === state.prs.length ? state.prs.length + ' open' : shown.length + ' of ' + state.prs.length + ' shown') : '';
    if (!state.loaded) { box.appendChild(emptyState('Enter an owner and repository above, then press “Load pull requests”.')); return; }
    if (state.prs.length === 0) { box.appendChild(emptyState('No open pull requests in ' + state.loaded.owner + '/' + state.loaded.repo + '.')); return; }
    if (shown.length === 0) { box.appendChild(emptyState('No pull requests match the filter.')); return; }
    shown.forEach(function (pr) {
      var job = latestJobFor(pr.number);
      var busy = job && ACTIVE[job.status];
      var actions = el('div', { class: 'row-actions' });
      if (job) {
        actions.appendChild(el('span', { class: 'badge ' + job.status, text: STATUS_TEXT[job.status] }));
        actions.appendChild(el('button', { class: 'ghost', text: 'View', on: { click: function () { openJob(job.id); } } }));
      }
      actions.appendChild(el('button', { class: 'primary', text: busy ? 'In progress…' : (job ? 'Review again' : 'Review'), disabled: busy ? 'disabled' : null,
        on: { click: function () { startReview(pr); } } }));
      box.appendChild(el('div', { class: 'card pr' + (job ? ' s-' + job.status : '') },
        avatar(pr.author),
        el('div', { class: 'pr-main' },
          el('div', { class: 'pr-title' }, el('span', { class: 'num', text: '#' + pr.number }),
            el('a', { href: pr.url, target: '_blank', rel: 'noopener noreferrer', text: pr.title })),
          el('div', { class: 'meta' }, el('span', { class: 'branch', text: pr.branch }), ' → ', el('span', { class: 'branch', text: pr.baseBranch }),
            ' · ' + (pr.author || 'unknown') + ' · updated ' + ago(pr.updatedAt) + (pr.draft ? ' · draft' : ''))),
        actions));
    });
  }
  function loadPrs() {
    var owner = $('owner').value.trim(), repo = $('repo').value.trim();
    if (!owner || !repo) { toast('Enter both the owner and the repository name.'); return Promise.resolve(); }
    store.set('owner', owner); store.set('repo', repo);
    $('load').disabled = true; $('load').textContent = 'Loading…';
    return api('/api/prs?owner=' + encodeURIComponent(owner) + '&repo=' + encodeURIComponent(repo)).then(function (data) {
      state.loaded = { owner: data.owner, repo: data.repo }; state.prs = data.pullRequests; renderPrs();
    }).catch(function (err) {
      state.loaded = null; state.prs = []; renderPrs(); toast(err.message);
    }).then(function () { $('load').disabled = false; $('load').textContent = 'Load pull requests'; });
  }

  // ---- reviews
  function startReview(pr) {
    api('/api/jobs', { method: 'POST', body: { owner: state.loaded.owner, repo: state.loaded.repo, pr: pr.number, autoPost: $('autopost').checked } })
      .then(function (job) { state.openJobId = job.id; return pollJobs().then(function () { $('panel').scrollIntoView({ behavior: 'smooth', block: 'start' }); }); })
      .catch(function (err) { toast(err.message); });
  }
  function openJob(id) { state.openJobId = id; renderPanel(); $('panel').scrollIntoView({ behavior: 'smooth', block: 'start' }); }

  function friendlyError(msg) {
    if (/connection error|ECONNREFUSED|fetch failed/i.test(msg)) return msg + '  — The AI model could not be reached. Is Ollama running?';
    if (/403|not accessible/i.test(msg)) return msg + '  — GitHub refused the request. Check the token’s permissions (Pull requests: read and write).';
    return msg;
  }

  function stepsForLocal(job) {
    var text = job.log.map(function (l) { return l.message; }).join('\n');
    var loaded = /changed file\(s\) to review/.test(text);
    var ruled = /Rule checks found/.test(text);
    var batch = job.log.map(function (l) { return l.message; }).filter(function (m) { return /AI is reviewing batch/.test(m); }).pop();
    return {
      steps: [
        { label: 'Loading and comparing the two versions', done: loaded },
        { label: 'Running the rule checks on every changed file', done: ruled },
        { label: batch ? batch.replace('AI is reviewing', 'AI is reviewing') + ' (a local model can take a few minutes per batch)' : 'AI review of the changes', done: false }
      ],
      active: !loaded ? 0 : (!ruled ? 1 : 2)
    };
  }

  function stepsFor(job) {
    if (job.kind === 'local') return stepsForLocal(job);
    var text = job.log.map(function (l) { return l.message; }).join('\n');
    var readDone = /Filtered changed files/.test(text);
    return {
      steps: [
        { label: 'Reading the pull request from GitHub', done: readDone },
        { label: 'AI is reviewing the changes (a local model can take a few minutes)', done: false }
      ],
      active: readDone ? 1 : 0
    };
  }

  function thumbButton(job, index, vote, label, title) {
    var current = job.feedback && job.feedback[String(index)];
    return el('button', { class: 'thumb' + (current === vote ? ' on-' + vote : ''), text: label, title: title, 'aria-pressed': current === vote ? 'true' : 'false',
      on: { click: function () { rate(job, index, current === vote ? null : vote); } } });
  }
  function rate(job, index, vote) {
    api('/api/jobs/' + encodeURIComponent(job.id) + '/feedback', { method: 'POST', body: { index: index, vote: vote } })
      .then(function () { return pollJobs(); }).catch(function (err) { toast(err.message); });
  }

  function findingNode(issue, job, index) {
    return el('div', { class: 'finding ' + issue.severity },
      el('div', { class: 'finding-top' }, el('span', { class: 'sev ' + issue.severity, text: issue.severity.toUpperCase() }),
        el('span', { class: 'loc', text: issue.file + ':' + issue.line }),
        el('span', { class: 'thumbs' },
          thumbButton(job, index, 'up', '👍', 'Correct and useful'),
          thumbButton(job, index, 'down', '👎', 'Wrong or not useful'))),
      el('h4', { text: issue.title }),
      el('p', { text: issue.explanation }),
      el('div', { class: 'fix' }, el('strong', { text: 'Suggested fix: ' }), issue.suggestedFix));
  }
  function severityPills(findings) {
    var wrap = el('div', { class: 'pills' });
    if (findings.length === 0) { wrap.appendChild(el('span', { class: 'pill none', text: 'No issues found' })); return wrap; }
    SEVERITIES.forEach(function (sev) {
      var n = findings.filter(function (f) { return f.severity === sev; }).length;
      if (n) wrap.appendChild(el('span', { class: 'pill ' + sev, text: n + ' ' + sev }));
    });
    return wrap;
  }

  function renderPanel() {
    var panel = $('panel');
    var job = state.jobs.filter(function (j) { return j.id === state.openJobId; })[0];
    if (!job) { panel.hidden = true; return; }
    panel.hidden = false;
    panel.textContent = '';
    panel.appendChild(el('div', { class: 'panel-head' },
      el('span', { class: 'panel-title', text: (job.kind === 'local' ? 'Local review · ' + job.label : job.owner + '/' + job.repo + ' · PR #' + job.pr) + (job.provider ? ' · ' + (job.provider === 'claude' ? 'Claude' : 'Ollama') : '') }),
      el('span', { class: 'badge ' + job.status, text: STATUS_TEXT[job.status] })));
    if (job.usage) {
      var entry = state.usage && state.usage.recent ? state.usage.recent.filter(function (r) { return r.id === job.id; })[0] : null;
      panel.appendChild(el('p', { class: 'hint', text: 'Used ' + job.usage.inputTokens.toLocaleString() + ' tokens in and ' + job.usage.outputTokens.toLocaleString() + ' out' + (entry && entry.costUsd !== undefined ? ' (≈ ' + fmtUsd(entry.costUsd) + ')' : '') + '.' }));
    }

    if (job.status === 'queued' || job.status === 'running') {
      var s = stepsFor(job);
      var list = el('ul', { class: 'steps' });
      s.steps.forEach(function (st, i) {
        var cls = st.done ? 'done' : (i === s.active ? 'active' : '');
        list.appendChild(el('li', { class: cls },
          st.done ? el('span', { class: 'step-ico', text: '✓' }) : (i === s.active ? el('span', { class: 'spinner' }) : el('span', { class: 'step-ico' })),
          st.label));
      });
      panel.appendChild(list);
      panel.appendChild(el('p', { class: 'hint', text: (job.status === 'queued' ? 'Waiting for ' : 'Running for ') + fmtDuration(Date.now() - new Date(job.createdAt).getTime()) }));
      if (job.status === 'queued') panel.appendChild(el('p', { class: 'hint', text: 'Another review is running; this one starts right after it.' }));
    }

    if (job.status === 'awaiting_confirmation' || (job.preview && (job.status === 'posted' || job.status === 'cancelled' || job.status === 'done'))) {
      var p = job.preview;
      var all = p.inlineFindings.concat(p.summaryOnlyFindings);
      panel.appendChild(el('div', { class: 'summary', text: p.summary }));
      panel.appendChild(severityPills(all));
      panel.appendChild(el('div', { class: 'actions', style: 'margin-top:4px' },
        el('button', { class: 'ghost', text: 'Copy as Markdown', on: { click: function () { copyText(toMarkdown(job)); } } })));
      all.forEach(function (i, idx) { panel.appendChild(findingNode(i, job, idx)); });
      if (job.status === 'awaiting_confirmation') {
        panel.appendChild(el('div', { class: 'actions' },
          el('button', { class: 'primary', text: 'Post to GitHub', on: { click: function () { decide(job, true); } } }),
          el('button', { text: 'Discard', on: { click: function () { decide(job, false); } } }),
          el('span', { class: 'hint', text: 'Nothing is posted until you press “Post to GitHub”.' })));
      }
    }

    if (job.status === 'done') {
      panel.appendChild(el('p', { class: 'hint', text: 'Finished. This review ran on your computer only — nothing was uploaded or posted anywhere. Use “Copy as Markdown” to share the findings.' }));
    }
    if (job.status === 'posted' && job.outcome) {
      panel.appendChild(el('p', null, '✓ Review posted: ', el('a', { class: 'link', href: job.outcome.reviewUrl, target: '_blank', rel: 'noopener noreferrer', text: 'open on GitHub' })));
    }
    if (job.status === 'skipped' && job.outcome) {
      panel.appendChild(el('p', { class: 'hint', text: job.outcome.reason === 'all_findings_already_posted' ? 'Every finding was already posted in an earlier review.' : 'There were no reviewable files in this pull request.' }));
    }
    if (job.status === 'cancelled') panel.appendChild(el('p', { class: 'hint', text: 'Discarded — nothing was posted to GitHub.' }));
    if (job.status === 'failed') panel.appendChild(el('p', { class: 'error', text: friendlyError(job.error || 'The review failed.') }));

    if (job.log.length) {
      panel.appendChild(el('details', null, el('summary', { text: 'Technical details' }),
        el('pre', { text: job.log.map(function (l) { return l.level.toUpperCase() + '  ' + l.message; }).join('\n') })));
    }
  }

  function decide(job, post) {
    api('/api/jobs/' + encodeURIComponent(job.id) + '/confirm', { method: 'POST', body: { post: post } })
      .then(pollJobs).catch(function (err) { toast(err.message); pollJobs(); });
  }

  function renderJobs() {
    var box = $('jobs');
    box.textContent = '';
    if (state.jobs.length === 0) { box.appendChild(emptyState('No reviews yet. Press “Review” on a pull request to start one.')); return; }
    state.jobs.slice(0, 15).forEach(function (job) {
      box.appendChild(el('div', { class: 'card pr s-' + job.status },
        el('div', { class: 'pr-main' },
          job.kind === 'local' ? el('div', { class: 'pr-title', text: 'Local · ' + job.label }) : el('div', { class: 'pr-title' }, el('span', { class: 'num', text: '#' + job.pr }), job.owner + '/' + job.repo),
          el('div', { class: 'meta', text: 'started ' + ago(job.createdAt) })),
        el('div', { class: 'row-actions' },
          el('span', { class: 'badge ' + job.status, text: STATUS_TEXT[job.status] }),
          el('button', { class: 'ghost', text: 'View', on: { click: function () { openJob(job.id); } } }))));
    });
  }

  var timer = null;
  function pollJobs() {
    return api('/api/jobs').then(function (data) {
      state.jobs = data.jobs; renderJobs(); renderPrs(); renderStats(); renderPanel(); loadAccuracy();
      // When a review has used more tokens, the header's usage chip is out of date.
      var usageSig = state.jobs.reduce(function (n, j) { return n + (j.usage ? j.usage.inputTokens + j.usage.outputTokens : 0); }, 0);
      if (usageSig !== state.usageSig) { state.usageSig = usageSig; refreshStatus(); }
      var anyActive = state.jobs.some(function (j) { return ACTIVE[j.status]; });
      clearTimeout(timer);
      if (anyActive) timer = setTimeout(pollJobs, 2000);
    }).catch(function () { clearTimeout(timer); timer = setTimeout(pollJobs, 5000); });
  }

  // ---- sign in / out
  state.authRequired = false;
  function showLogin() { $('app').hidden = true; $('login').hidden = false; $('chips').textContent = ''; }
  function showApp() { $('login').hidden = true; $('app').hidden = false; }
  function signIn() {
    api('/api/login', { method: 'POST', body: { password: $('password').value } })
      .then(function () { $('password').value = ''; state.authRequired = true; startApp(); })
      .catch(function (err) { toast(err.message); });
  }
  function signOut() { api('/api/logout', { method: 'POST', body: {} }).then(showLogin).catch(function () { showLogin(); }); }

  // ---- auto-review switch
  var autoState = null;
  function renderAuto() {
    var box = $('autoreview');
    if (!autoState || !autoState.available) { box.disabled = true; $('autostatus').textContent = '(not available on this server)'; return; }
    box.disabled = false; box.checked = autoState.enabled;
    var text = '';
    if (autoState.enabled) {
      text = 'watching ' + autoState.owner + '/' + autoState.repo + (autoState.autoPost ? ' · posts automatically' : ' · waits for your OK');
      text += autoState.lastError ? ' · ' + autoState.lastError : (autoState.lastCheck ? ' · checked ' + ago(autoState.lastCheck) : '');
    }
    $('autostatus').textContent = text;
  }
  function loadAuto() { return api('/api/auto').then(function (a) { autoState = a; renderAuto(); }).catch(function () { /* shown elsewhere */ }); }
  function toggleAuto() {
    var on = $('autoreview').checked;
    api('/api/auto', { method: 'POST', body: { enabled: on, autoPost: $('autopost').checked, owner: $('owner').value.trim(), repo: $('repo').value.trim() } })
      .then(function (a) { autoState = a; renderAuto(); toast(on ? 'Auto-review is on. New pull requests and commits will be reviewed.' : 'Auto-review is off.'); })
      .catch(function (err) { toast(err.message); loadAuto(); });
  }

  // ---- model accuracy from thumbs up/down
  function loadAccuracy() {
    return api('/api/feedback').then(function (f) {
      $('accuracy').textContent = f.percentUp === null ? 'Rate findings with 👍 / 👎 to track how accurate the AI is'
        : 'Rated useful: ' + f.percentUp + '%  (' + f.up + ' 👍 · ' + f.down + ' 👎)';
    }).catch(function () { /* optional */ });
  }

  // ---- review rules editor
  var RULE_TEMPLATE = '<!-- applies-to: .js, .ts -->\n# My rules\n\n- R1. Describe the rule here, and what to report when it is broken.\n';
  state.docs = [];
  function renderRules() {
    var box = $('rules');
    box.textContent = '';
    if (state.docs.length === 0) { box.appendChild(emptyState('No rule documents yet. Press “New document” to add one.')); return; }
    state.docs.forEach(function (doc) {
      var scope = el('span', null);
      (doc.appliesTo || ['all files']).forEach(function (ext) { scope.appendChild(el('span', { class: 'tag', text: ext })); scope.appendChild(document.createTextNode(' ')); });
      box.appendChild(el('div', { class: 'card pr' },
        el('div', { class: 'pr-main' },
          el('div', { class: 'pr-title', text: doc.name }),
          el('div', { class: 'meta' }, doc.ruleCount + ' rule' + (doc.ruleCount === 1 ? '' : 's') + ' · applies to: ', scope)),
        el('div', { class: 'row-actions' }, el('button', { class: 'ghost', text: 'Edit', on: { click: function () { openEditor(doc); } } }))));
    });
  }
  function loadRules() { return api('/api/conventions').then(function (d) { state.docs = d.docs; renderRules(); }).catch(function () { $('rules').textContent = ''; }); }

  function openEditor(doc) {
    var panel = $('editor');
    var isNew = !doc;
    panel.hidden = false; panel.textContent = '';
    var name = el('input', { type: 'text', placeholder: 'my-rules.md', 'aria-label': 'File name', spellcheck: 'false' });
    name.value = doc ? doc.name : '';
    if (!isNew) name.setAttribute('readonly', 'readonly');
    var area = el('textarea', { 'aria-label': 'Rules in Markdown', spellcheck: 'false' });
    area.value = doc ? doc.content : RULE_TEMPLATE;
    var file = el('input', { type: 'file', accept: '.md,.markdown,.txt,text/markdown,text/plain', 'aria-label': 'Load rules from a Markdown file' });
    file.addEventListener('change', function () {
      var f = file.files && file.files[0];
      if (!f) return;
      if (f.size > 60000) { toast('That file is too large (the limit is 60,000 characters).'); return; }
      var reader = new FileReader();
      reader.onload = function () {
        area.value = String(reader.result);
        if (isNew && !name.value) name.value = f.name.replace(/[^A-Za-z0-9_.-]/g, '-').replace(/\.(txt|markdown)$/i, '.md');
      };
      reader.readAsText(f);
    });
    panel.appendChild(el('div', { class: 'panel-head' }, el('span', { class: 'panel-title', text: isNew ? 'New rule document' : 'Edit ' + doc.name })));
    panel.appendChild(el('p', { class: 'hint', text: 'The AI reads these rules at every review, so a change applies to the next review. Give each rule a number (like “- R1.”) so findings can cite it. Start with “<!-- applies-to: .ext -->” to limit a document to some file types. PDFs are not supported — convert them to Markdown first.' }));
    panel.appendChild(el('div', { class: 'bar' }, el('div', { class: 'field' }, el('label', { class: 'lbl', text: 'FILE NAME' }), name), el('div', { class: 'field' }, el('label', { class: 'lbl', text: 'OR LOAD A MARKDOWN FILE' }), file)));
    panel.appendChild(el('div', { style: 'margin-top:12px' }, area));
    var actions = el('div', { class: 'actions' },
      el('button', { class: 'primary', text: 'Save', on: { click: function () {
        api('/api/conventions/' + encodeURIComponent(name.value.trim()), { method: 'PUT', body: { content: area.value } })
          .then(function () { toast('Saved. The next review will use these rules.'); panel.hidden = true; return loadRules(); })
          .catch(function (err) { toast(err.message); });
      } } }),
      el('button', { text: 'Cancel', on: { click: function () { panel.hidden = true; } } }));
    if (!isNew) {
      actions.appendChild(el('button', { text: 'Delete', on: { click: function () {
        if (!window.confirm('Delete ' + doc.name + '? The AI will stop using these rules.')) return;
        api('/api/conventions/' + encodeURIComponent(doc.name), { method: 'DELETE' })
          .then(function () { toast('Deleted.'); panel.hidden = true; return loadRules(); })
          .catch(function (err) { toast(err.message); });
      } } }));
    }
    panel.appendChild(actions);
    panel.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }

  // ---- start up
  var started = false;
  function startApp() {
    showApp();
    renderPrs(); renderJobs();
    refreshStatus(); loadAuto(); loadRules(); loadAccuracy();
    if (started) { pollJobs(); return; }
    started = true;
    $('owner').value = store.get('owner');
    $('repo').value = store.get('repo');
    setInterval(function () { if (!$('app').hidden) { refreshStatus(); loadAuto(); } }, 15000);
    api('/api/status').then(function (s) {
      if (!$('owner').value && s.github.owner) $('owner').value = s.github.owner;
      if (!$('repo').value && s.github.repo) $('repo').value = s.github.repo;
      if ($('owner').value && $('repo').value) return loadPrs();
    }).catch(function () { /* status chip already shows the problem */ }).then(pollJobs);
  }

  $('load').addEventListener('click', loadPrs);
  $('filter').addEventListener('input', renderPrs);
  $('statusfilter').addEventListener('change', renderPrs);
  $('bulk').addEventListener('click', reviewAllNew);
  $('autoreview').addEventListener('change', toggleAuto);
  $('newdoc').addEventListener('click', function () { openEditor(null); });
  $('signin').addEventListener('click', signIn);
  $('password').addEventListener('keydown', function (e) { if (e.key === 'Enter') signIn(); });
  [$('owner'), $('repo')].forEach(function (i) { i.addEventListener('keydown', function (e) { if (e.key === 'Enter') loadPrs(); }); });

  $('app').hidden = true;
  api('/api/session').then(function (s) {
    state.authRequired = s.authRequired;
    if (s.authRequired && !s.authenticated) showLogin(); else startApp();
  }).catch(function () { startApp(); });
})();
</script>
</body>
</html>
